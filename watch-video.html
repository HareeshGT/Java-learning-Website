<div id="stage"></div><p class="actions" style="margin-top:1rem"><button class="btn" type="button" id="back">← Back to playlist</button><a class="btn" id="dl" href="#" hidden>Download video</a></p>
<script>
var v=new URLSearchParams(location.search).get("video"),S=document.getElementById("stage"),P="https://HareeshGT.github.io/ElearnVC/";
document.getElementById("back").onclick=function(){history.length>1?history.back():location.href="videos.html"};
if(!v){S.innerHTML='<p class="notice">No video selected. <a href="videos.html">Browse the video playlists</a>.</p>'}
else{var e=document.createElement("video");e.className="player";e.controls=true;e.src=P+encodeURIComponent(v)+".mp4";
e.onerror=function(){S.insertAdjacentHTML("afterend",'<p class="notice" role="alert">This video could not be loaded. Please try again later.</p>')};S.appendChild(e);
var d=document.getElementById("dl");d.href=e.src;d.hidden=false}
</script>
